name: rent_system
description: RentFlow — rent management for owners and renters.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  bloc: ^9.2.0
  cloud_firestore: ^6.4.0
  dio: ^5.9.0
  equatable: ^2.0.7
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_localizations:
    sdk: flutter
  go_router: ^16.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  permission_handler: ^12.0.1
  supabase_flutter: ^2.12.0

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.23
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/common/app_icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#FFFFFF"
  # image: assets/common/app_icon.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    # image: assets/common/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/common/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/common/app_icon.png
  remove_alpha_ios: true
